[project]
name = "d3-grc-platform"
version = "0.11.0"
description = "Tenant-scoped D3 GRC platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "python-multipart==0.0.34",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a dedicated migrated PostgreSQL test database",
]
